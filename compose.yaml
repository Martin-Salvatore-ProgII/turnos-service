# Levanta el sistema completo: el servicio de turnos con su base y, incluido,
# el servicio de catálogo con la suya. Requiere catalogo-service clonado al lado.

include:
  - ../catalogo-service/compose.yaml

services:
  turnos-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${TURNOS_DB_NAME}
      POSTGRES_USER: ${TURNOS_DB_USER}
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD}
    ports:
      - "${TURNOS_DB_PORT}:5432"
    volumes:
      - turnos-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TURNOS_DB_USER} -d ${TURNOS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  turnos-service:
    build: .
    environment:
      DB_URL: jdbc:postgresql://turnos-db:5432/${TURNOS_DB_NAME}
      DB_USER: ${TURNOS_DB_USER}
      DB_PASSWORD: ${TURNOS_DB_PASSWORD}
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt-private.pem
      CATEDRA_API_URL: ${TURNOS_CATEDRA_API_URL}
      CATEDRA_TECHNICAL_TOKEN: ${TURNOS_CATEDRA_TECHNICAL_TOKEN}
      # El catálogo, por la red interna de Compose: su puerto dentro del contenedor, también por HTTPS.
      CATALOG_API_URL: https://catalogo-service:8080
      # HTTPS con el certificado autofirmado de secrets/, generado con generar-certificado.sh (ADR-0035).
      SPRING_PROFILES_ACTIVE: tls
      TLS_CERTIFICATE_LOCATION: file:/run/secrets/tls.crt
      TLS_PRIVATE_KEY_LOCATION: file:/run/secrets/tls.key
      ADMIN_LOGIN: ${TURNOS_ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${TURNOS_ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${TURNOS_ADMIN_EMAIL:-}
    volumes:
      # Archivos secretos, fuera de Git. Se montan en solo lectura.
      - ./secrets:/run/secrets:ro
    ports:
      - "${TURNOS_PORT}:8080"
    depends_on:
      turnos-db:
        condition: service_healthy

volumes:
  turnos-db-data:
