spring:
  application:
    name: turnos-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    # El esquema lo define Flyway. Hibernate solo verifica que las entities coincidan con las tablas.
    hibernate:
      ddl-auto: validate
    # La sesión de base se cierra al terminar el caso de uso, no al terminar la respuesta HTTP.
    open-in-view: false

turnos:
  catedra:
    # URL base de la API de la cátedra y JWT técnico, desde el .env (ADR-0005). Kafka no se configura
    # acá: se pide a la cátedra al arrancar.
    api-url: ${CATEDRA_API_URL}
    technical-token: ${CATEDRA_TECHNICAL_TOKEN}
    # Timeouts hacia la cátedra (ADR-0029, RNF-09). Se pueden cambiar con las variables
    # TURNOS_CATEDRA_CONNECT_TIMEOUT y TURNOS_CATEDRA_READ_TIMEOUT.
    connect-timeout: 2s
    read-timeout: 5s
  catalog:
    # URL base del servicio de catálogo (ADR-0002). En Docker Compose es la del contenedor.
    api-url: ${CATALOG_API_URL}
    # Timeouts hacia el catálogo (ADR-0029, RNF-09). Se pueden cambiar con las variables
    # TURNOS_CATALOG_CONNECT_TIMEOUT y TURNOS_CATALOG_READ_TIMEOUT.
    connect-timeout: 2s
    read-timeout: 5s
  command-retry:
    # Operaciones con efectos que son seguras de repetir: la confirmación inicial y, más adelante, la
    # cancelación (ADR-0029, RNF-09). Hasta 2 reintentos, esperando 500 ms y después 1 s. Se pueden
    # cambiar con TURNOS_COMMAND_RETRY_RETRIES y TURNOS_COMMAND_RETRY_INITIAL_BACKOFF.
    retries: 2
    initial-backoff: 500ms
  availability:
    # Cuántos días hacia adelante acepta la disponibilidad de turnos (ADR-0015, ADR-0065, RNF-09). Tiene
    # que valer lo mismo que en el catálogo. Se puede cambiar con TURNOS_AVAILABILITY_HORIZON_DAYS.
    horizon-days: 60
  security:
    jwt:
      # Ubicación de la clave privada RSA con la que se firma el JWT de usuario (ADR-0032).
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
      # Vigencia del token: normal y con rememberMe (ADR-0033).
      validity: 24h
      remember-me-validity: 30d
    # Administrador inicial, creado al arrancar. Los tres vacíos: no hay administrador (ADR-0061).
    admin:
      login: ${ADMIN_LOGIN:}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:}
    cors:
      # Orígenes web que pueden llamar a la API desde un navegador. Vacío: ninguno (ADR-0036).
      allowed-origins: []
