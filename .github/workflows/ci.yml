# Compila el servicio y ejecuta todas las pruebas (ADR-0046).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Cachea las dependencias de Gradle entre ejecuciones.
      - uses: gradle/actions/setup-gradle@v6

      # Las pruebas levantan PostgreSQL con Testcontainers; el runner ya trae Docker.
      - run: ./gradlew build

      - name: Subir el reporte de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-de-pruebas
          path: build/reports/tests/
